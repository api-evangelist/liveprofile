aid: liveprofile
name: Liveprofile
description: >-
  LiveProfile is a cross-platform mobile messaging and chat product ("Stay connected with people
  and things that matter. Chat securely and express yourself freely."). It was originally backed by
  Lightspeed Venture Partners and is surfaced in the API Evangelist network as a portfolio-derived
  company profile. As of this enrichment pass, liveprofile.com is an invite-only relaunch teaser
  ("The New LiveProfile") running a waitlist, with apps advertised for Android, iPhone & iPad, and
  Mac/PC. The company maintains a public GitHub organization and a BetterUptime status page, but
  publishes no public API surface, developer documentation, OpenAPI, or SDKs at this time — so this
  profile carries identity and operational signals only, awaiting a real developer/API surface.
